name: space
description: "A new Flutter project."

publish_to: 'none' 


version: 1.0.0+1

environment:
  sdk: ^3.11.0


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.2

dev_dependencies:
  build_runner: ^2.12.0
  flutter_gen_runner:
  flutter_test:
    sdk: flutter

 
  flutter_lints: ^6.0.0

flutter:

 
  uses-material-design: true

  assets:
    - assets/imgs/
    - assets/icons/

  
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Italic-VariableFont_opsz,wght.ttf
        - asset: assets/fonts/Inter-VariableFont_opsz,wght.ttf

    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-VariableFont_wght (1).ttf


 
flutter_gen:
  output: lib/core/gen
  integrations:
    image: true
    flutter_svg: true


